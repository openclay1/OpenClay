<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenClay — COANA Labs</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,600,700" rel="stylesheet">
  <style>
    :root {
      --bg: #161310; --surface: #1b1814; --surface-2: #201d19;
      --border: #373330; --text: #cec8c0; --muted: #7a7468; --faint: #524e48;
      --primary: #e06438; --primary-hover: #d05025;
      --accent-soft: rgba(224,100,56,0.10);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: var(--bg);
      font-family: 'Satoshi','Inter',system-ui,sans-serif; color: var(--text); overflow: hidden; }
    #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    #canvas-container canvas { display: block; }
    #title { position: fixed; top: 20px; left: 0; right: 0; text-align: center; z-index: 10; pointer-events: none; }
    #title h1 { font-family: 'Instrument Serif',Georgia,serif; font-style: italic;
      font-size: 2rem; font-weight: 400; color: var(--primary); line-height: 1.15;
      text-shadow: 0 2px 20px rgba(224,100,56,0.2); }
    #title p { font-size: 0.7rem; color: var(--faint); margin-top: 2px; letter-spacing: 0.05em; }

    /* Bottom controls */
    #controls { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      z-index: 10; width: calc(100vw - 24px); max-width: 560px; }
    #input-row { display: flex; gap: 4px; align-items: center; }
    #clay-input { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--border);
      border-radius: 9999px; padding: 10px 14px; font-family: inherit; font-size: 13px;
      color: var(--text); outline: none; transition: border-color 180ms; }
    #clay-input::placeholder { color: var(--faint); }
    #clay-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--accent-soft); }
    .btn-icon { background: var(--surface); border: 1px solid var(--border); border-radius: 50%;
      width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 14px; transition: all 180ms; flex-shrink: 0; }
    .btn-icon:hover { border-color: var(--primary); background: var(--accent-soft); }
    .btn-icon.active { background: var(--primary); border-color: var(--primary); }
    #clay-send { background: var(--primary); color: #fff; border: none; border-radius: 9999px;
      padding: 10px 14px; font-family: inherit; font-size: 12px; font-weight: 500;
      cursor: pointer; transition: all 180ms; box-shadow: 0 2px 8px rgba(224,100,56,0.3);
      white-space: nowrap; flex-shrink: 0; }
    #clay-send:hover { background: var(--primary-hover); transform: translateY(-1px); }

    /* Badges row */
    #badges { display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      margin-top: 6px; min-height: 20px; }
    .badge { font-size: 0.7rem; color: var(--muted); background: var(--surface);
      border: 1px solid var(--border); border-radius: 9999px; padding: 3px 10px;
      display: flex; align-items: center; gap: 4px; }
    .badge .close { cursor: pointer; opacity: 0.6; }
    .badge .close:hover { opacity: 1; color: var(--primary); }

    /* Status bar */
    #status-bar { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      z-index: 10; text-align: center; pointer-events: none; width: 90vw; }
    #status-bar p { font-size: 0.6rem; color: var(--faint); letter-spacing: 0.04em; line-height: 1.5; }

    /* Settings panel */
    #settings-btn { position: fixed; top: 20px; right: 20px; z-index: 20; }
    #settings-panel { position: fixed; top: 0; right: -360px; width: 340px; height: 100%;
      background: var(--surface); border-left: 1px solid var(--border); z-index: 30;
      transition: right 250ms cubic-bezier(0.16,1,0.3,1); padding: 24px; overflow-y: auto; }
    #settings-panel.open { right: 0; }
    #settings-panel h2 { font-family: 'Instrument Serif',Georgia,serif; font-style: italic;
      color: var(--primary); font-size: 1.3rem; margin-bottom: 16px; }
    .source-item { display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--border); }
    .source-item label { font-size: 0.85rem; color: var(--text); }
    .source-item small { font-size: 0.7rem; color: var(--muted); display: block; }
    .toggle { width: 40px; height: 22px; background: var(--border); border-radius: 11px;
      position: relative; cursor: pointer; transition: background 180ms; border: none; flex-shrink: 0; }
    .toggle.on { background: var(--primary); }
    .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
      background: #fff; border-radius: 50%; transition: left 180ms; }
    .toggle.on::after { left: 21px; }

    ::selection { background: rgba(224,100,56,0.2); }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>

  <div id="title">
    <h1>OpenClay</h1>
    <p>COANA LABS &middot; LOCAL &middot; PRIVADO &middot; TUYO</p>
  </div>

  <button class="btn-icon" id="settings-btn" onclick="toggleSettings()">&#9881;</button>

  <div id="settings-panel">
    <h2>Fuentes conectadas</h2>
    <div id="sources-list">Detecting...</div>
    <br>
    <button onclick="saveWatchers()" style="background:var(--primary);color:#fff;border:none;
      border-radius:9999px;padding:10px 20px;cursor:pointer;font-family:inherit;width:100%;">
      Guardar / Save</button>
    <br><br>
    <button onclick="toggleSettings()" style="background:none;color:var(--muted);border:1px solid var(--border);
      border-radius:9999px;padding:8px 16px;cursor:pointer;font-family:inherit;width:100%;">
      Cerrar</button>
  </div>

  <div id="canvas-container"></div>

  <div id="status-bar">
    <p id="privacy-text">100% local &middot; nada sale de tu computadora</p>
    <p id="memory-status"></p>
  </div>

  <div id="controls">
    <div id="input-row">
      <button class="btn-icon" id="mic-btn" onclick="toggleMic()" title="Voice input">&#127908;</button>
      <button class="btn-icon" id="clip-btn" onclick="openFilePicker()" title="Upload PDF/TXT">&#128206;</button>
      <input type="text" id="clay-input" placeholder="Pregunta algo... / Ask anything..." autocomplete="off">
      <button id="clay-send" onclick="handleSend()">Enviar</button>
      <button class="btn-icon" id="sound-btn" onclick="toggleSound()" title="Toggle voice output">&#128266;</button>
    </div>
    <div id="badges"></div>
    <input type="file" id="file-picker" accept=".pdf,.txt,.md" style="display:none" onchange="handleFileUpload(event)">
  </div>

  <script src="/src/sketch.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>

  <script>
    // ── State ──
    let voiceOutputEnabled = true;
    let isRecording = false;
    let mediaRecorder = null;
    let settingsOpen = false;
    let detectedApps = {};
    let watcherSelections = {};

    // ── Input handling ──
    document.getElementById('clay-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
    });

    // ── File upload ──
    function openFilePicker() { document.getElementById('file-picker').click(); }

    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const formData = new FormData();
      formData.append('file', file);
      try {
        const resp = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await resp.json();
        if (data.ok) {
          showBadge('doc', '\u{1F4C4} ' + file.name + ' cargado');
          if (typeof triggerPulse === 'function') triggerPulse();
        } else {
          showBadge('doc', '\u26A0 ' + (data.error || 'Upload failed'));
        }
      } catch (e) { showBadge('doc', '\u26A0 Error uploading'); }
      event.target.value = '';
    }

    function clearDocument() {
      fetch('/api/clear-document', { method: 'POST' });
      removeBadge('doc');
    }

    // ── Badges ──
    function showBadge(id, text, closable=true) {
      removeBadge(id);
      const badges = document.getElementById('badges');
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.id = 'badge-' + id;
      badge.innerHTML = text + (closable ?
        ' <span class="close" onclick="' + (id==='doc' ? 'clearDocument()' : 'removeBadge(\''+id+'\')') + '">\u2715</span>' : '');
      badges.appendChild(badge);
    }

    function removeBadge(id) {
      const el = document.getElementById('badge-' + id);
      if (el) el.remove();
    }

    // ── Voice input (Web Speech API) ──
    function toggleMic() {
      if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
        showBadge('voice', 'Voice not supported in this browser', true);
        return;
      }
      const btn = document.getElementById('mic-btn');
      if (isRecording) {
        isRecording = false;
        btn.classList.remove('active');
        if (window._recognition) window._recognition.stop();
        return;
      }
      isRecording = true;
      btn.classList.add('active');
      if (typeof setRecordingState === 'function') setRecordingState(true);

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'es-PR';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
      recognition.continuous = false;
      window._recognition = recognition;

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        document.getElementById('clay-input').value = text;
        // Never auto-submit
      };
      recognition.onerror = (event) => {
        showBadge('voice', 'No entend\u00ED \u2014 intenta de nuevo', true);
        setTimeout(() => removeBadge('voice'), 2000);
      };
      recognition.onend = () => {
        isRecording = false;
        btn.classList.remove('active');
        if (typeof setRecordingState === 'function') setRecordingState(false);
      };
      recognition.start();
    }

    // ── Voice output (Web Speech Synthesis) ──
    function toggleSound() {
      voiceOutputEnabled = !voiceOutputEnabled;
      const btn = document.getElementById('sound-btn');
      btn.innerHTML = voiceOutputEnabled ? '\u{1F50A}' : '\u{1F507}';
      btn.classList.toggle('active', !voiceOutputEnabled);
    }

    function speakText(text) {
      if (!voiceOutputEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text.substring(0, 2000));
      // Detect language
      const spanishWords = (text.match(/\b(de|el|la|los|las|en|que|por|con|para|una|del)\b/gi) || []).length;
      utterance.lang = spanishWords > 3 ? 'es-PR' : 'en-US';
      utterance.rate = 0.95;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    // ── Settings panel ──
    function toggleSettings() {
      settingsOpen = !settingsOpen;
      document.getElementById('settings-panel').classList.toggle('open', settingsOpen);
      if (settingsOpen) detectApps();
    }

    async function detectApps() {
      try {
        const resp = await fetch('/api/detect-apps', { method: 'POST',
          headers: {'Content-Type': 'application/json'}, body: '{}' });
        detectedApps = await resp.json();
        renderSources();
      } catch (e) { document.getElementById('sources-list').textContent = 'Error detecting apps'; }
    }

    function renderSources() {
      const container = document.getElementById('sources-list');
      container.innerHTML = '';
      const names = { zotero: 'Zotero', obsidian: 'Obsidian', downloads: 'Downloads', desktop: 'Desktop' };
      for (const [key, info] of Object.entries(detectedApps)) {
        if (!info.available) continue;
        const item = document.createElement('div');
        item.className = 'source-item';
        const isOn = watcherSelections[info.path] || false;
        item.innerHTML = '<div><label>' + (names[key]||key) + '</label><small>' +
          info.path + (info.pdf_count !== undefined ? ' (' + info.pdf_count + ' PDFs)' : '') +
          '</small></div><button class="toggle ' + (isOn?'on':'') +
          '" onclick="toggleWatcher(this,\'' + info.path.replace(/'/g,"\\'") + '\')"></button>';
        container.appendChild(item);
      }
    }

    function toggleWatcher(btn, path) {
      const isOn = btn.classList.toggle('on');
      watcherSelections[path] = isOn;
    }

    async function saveWatchers() {
      const folders = Object.entries(watcherSelections).filter(([_,v])=>v).map(([k])=>k);
      try {
        const resp = await fetch('/api/setup-watchers', { method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ folders }) });
        const data = await resp.json();
        showBadge('watchers', '\u{1F441} Watching ' + (data.watching?.length || 0) + ' folders', true);
        toggleSettings();
      } catch (e) {}
    }

    // ── Status polling ──
    async function updateStatus() {
      try {
        const resp = await fetch('/api/status', { method: 'POST',
          headers: {'Content-Type': 'application/json'}, body: '{}' });
        const data = await resp.json();
        const memEl = document.getElementById('memory-status');
        let parts = [];
        if (data.wiki_pages > 0) parts.push('\u{1F4AD} wiki: ' + data.wiki_pages + ' p\u00E1ginas');
        if (data.preferences_active) parts.push('preferencias activas');
        parts.push('modo ' + (data.mode === 'agentic' ? 'agente' : 'simple'));
        memEl.textContent = parts.join(' \u00B7 ');

        if (data.mode) showBadge('mode', 'modo ' + (data.mode==='agentic'?'agente':'simple'), false);
        if (data.new_ingested > 0) {
          showBadge('ingested', 'Le\u00ED ' + data.new_ingested + ' archivos nuevos', true);
        }
      } catch (e) {}
    }
    updateStatus();
    setInterval(updateStatus, 15000);
  </script>
</body>
</html>
