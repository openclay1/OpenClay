<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OpenClay</title>
<style>
  :root{--bg:#161310;--surface:#1b1814;--border:#373330;--text:#cec8c0;--muted:#7a7468;--primary:#e06438;--primary-hover:#d05025;--accent-soft:rgba(224,100,56,.1)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Satoshi','Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  header{padding:12px 16px;border-bottom:1px solid var(--border);text-align:center}
  header h1{font-family:'Georgia',serif;font-style:italic;font-size:1.4rem;color:var(--primary)}
  .chat{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
  .bubble{max-width:85%;padding:10px 14px;border-radius:16px;font-size:.95rem;line-height:1.5;word-wrap:break-word}
  .bubble.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
  .bubble.agent{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
  .bubble.system{align-self:center;background:var(--accent-soft);color:var(--muted);font-size:.85rem;border-radius:12px}
  .input-bar{padding:8px 12px;border-top:1px solid var(--border);background:var(--surface);display:flex;gap:8px;align-items:flex-end}
  .input-bar textarea{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px 14px;color:var(--text);font-size:1rem;resize:none;min-height:44px;max-height:120px;font-family:inherit}
  .input-bar textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px var(--accent-soft)}
  .input-bar textarea::placeholder{color:var(--muted)}
  .btn{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .18s}
  .btn-send{background:var(--primary);color:#fff}
  .btn-send:active{background:var(--primary-hover);transform:scale(.95)}
  .btn-mic{background:var(--surface);border:1px solid var(--border);color:var(--muted)}
  .btn-mic.listening{background:var(--primary);color:#fff;border-color:var(--primary);animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,100,56,.4)}50%{box-shadow:0 0 0 10px rgba(224,100,56,0)}}
  .upload-zone{padding:8px 12px;background:var(--surface);border-top:1px solid var(--border)}
  .upload-area{border:1.5px dashed var(--border);border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:.9rem;cursor:pointer;transition:all .18s}
  .upload-area:hover,.upload-area.dragover{border-color:var(--primary);background:var(--accent-soft)}
  .upload-area input{display:none}
  .upload-btn{display:inline-block;margin-top:8px;padding:8px 16px;background:var(--primary);color:#fff;border:none;border-radius:999px;font-size:.85rem;cursor:pointer}
  .conn-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
  .conn-dot.on{background:#4a4}
  .conn-dot.off{background:#a44}
</style>
</head>
<body>
<header>
  <h1>OpenClay</h1>
  <small><span class="conn-dot off" id="dot"></span><span id="conn-label">Connecting...</span></small>
</header>

<div class="chat" id="chat"></div>

<div class="upload-zone">
  <div class="upload-area" id="dropArea">
    Drop files here or
    <br><button class="upload-btn" onclick="fileInput.click()">Upload Media or Doc</button>
    <input type="file" id="fileInput" multiple accept=".jpg,.jpeg,.png,.mp4,.mov,.pdf,.txt,.md">
  </div>
</div>

<div class="input-bar">
  <textarea id="msg" rows="1" placeholder="Ask OpenClay anything..."></textarea>
  <button class="btn btn-mic" id="micBtn" title="Voice input">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
  </button>
  <button class="btn btn-send" id="sendBtn" title="Send">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
  </button>
</div>

<script>
const chat = document.getElementById('chat');
const msg = document.getElementById('msg');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const dot = document.getElementById('dot');
const connLabel = document.getElementById('conn-label');
const dropArea = document.getElementById('dropArea');
const fileInput = document.getElementById('fileInput');

let ws, reconnectTimer;
const WS_URL = `ws://${location.hostname}:8765`;

function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { dot.className='conn-dot on'; connLabel.textContent='Connected'; };
  ws.onclose = () => { dot.className='conn-dot off'; connLabel.textContent='Reconnecting...'; reconnectTimer=setTimeout(connect,3000); };
  ws.onerror = () => ws.close();
  ws.onmessage = e => {
    try {
      const data = JSON.parse(e.data);
      if (data.type === 'response') addBubble(data.text, 'agent');
      else if (data.type === 'system') addBubble(data.text, 'system');
      else if (data.type === 'upload_ack') addBubble(data.text, 'system');
    } catch(_) { addBubble(e.data, 'agent'); }
  };
}

function addBubble(text, cls) {
  const d = document.createElement('div');
  d.className = `bubble ${cls}`;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function send() {
  const t = msg.value.trim();
  if (!t || !ws || ws.readyState !== 1) return;
  addBubble(t, 'user');
  ws.send(JSON.stringify({type:'message', text:t}));
  msg.value = '';
  msg.style.height = 'auto';
}

sendBtn.onclick = send;
msg.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
msg.addEventListener('input', () => { msg.style.height='auto'; msg.style.height=msg.scrollHeight+'px'; });

// ── Voice (Web Speech API) ──
let recognition, listening = false;
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';
  recognition.onresult = e => { msg.value = e.results[0][0].transcript; send(); };
  recognition.onend = () => { listening=false; micBtn.classList.remove('listening'); };
  recognition.onerror = () => { listening=false; micBtn.classList.remove('listening'); };
}
micBtn.onclick = () => {
  if (!recognition) { addBubble('Speech not supported in this browser.','system'); return; }
  if (listening) { recognition.stop(); } else { recognition.start(); listening=true; micBtn.classList.add('listening'); }
};

// ── File upload ──
const ALLOWED = ['jpg','jpeg','png','mp4','mov','pdf','txt','md'];

function uploadFiles(files) {
  for (const file of files) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (!ALLOWED.includes(ext)) { addBubble(`Skipped ${file.name} — unsupported type.`, 'system'); continue; }
    const reader = new FileReader();
    reader.onload = () => {
      ws.send(JSON.stringify({type:'file', name:file.name, data:reader.result}));
      addBubble(`Uploading ${file.name}...`, 'system');
    };
    reader.readAsDataURL(file);
  }
}

fileInput.addEventListener('change', () => { if (fileInput.files.length) uploadFiles(fileInput.files); fileInput.value=''; });
dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.classList.add('dragover'); });
dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
dropArea.addEventListener('drop', e => { e.preventDefault(); dropArea.classList.remove('dragover'); if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files); });

connect();
</script>
</body>
</html>
