<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
  <title>ClayCode</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #161310;
      color: #cec8c0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      user-select: none;
      -webkit-app-region: drag;
    }

    /* Clay symbol — soft deformed square */
    .symbol {
      width: 56px;
      height: 56px;
      background: #e06438;
      border-radius: 38% 62% 55% 45% / 42% 48% 52% 58%;
      animation: breathe 2.4s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { border-radius: 38% 62% 55% 45% / 42% 48% 52% 58%; transform: scale(1); }
      50%       { border-radius: 55% 45% 42% 58% / 58% 52% 48% 42%; transform: scale(1.06); }
    }

    .wordmark {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #cec8c0;
    }

    #spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #373330;
      border-top-color: #e06438;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #status {
      font-size: 0.78rem;
      color: #7a7468;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <div class="symbol"></div>
  <div class="wordmark">ClayCode</div>
  <div id="spinner"></div>
  <p id="status">Starting…</p>
</body>
</html>
