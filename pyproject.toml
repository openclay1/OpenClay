[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclay"
version = "2.0.0"
description = "Turn intention into infrastructure. Local-first AI agent bootstrapper."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Anomalia", email = "openclay@proton.me"},
]
keywords = ["ai", "agent", "local", "wiki", "llm", "ollama", "infrastructure"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "gradio>=4.0.0",
    "requests>=2.31.0",
    "tweepy>=4.14.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.0.0"]
all = ["anthropic>=0.40.0", "openai>=1.0.0"]

[project.urls]
Homepage = "https://github.com/openclay1/OpenClay"
Repository = "https://github.com/openclay1/OpenClay"

[project.scripts]
openclay = "app:main"

[tool.setuptools]
py-modules = [
    "app", "panel", "agent_backend", "wiki_engine", "memory",
    "credential_store", "post_flows", "twitter_post", "vision_caption",
    "introspect", "installer",
]

[tool.setuptools.package-data]
"*" = ["theme.css", "openclay.md", "AGENTS.md", ".env.example"]
