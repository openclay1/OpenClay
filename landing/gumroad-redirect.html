<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenClay Pro — Redirecting…</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0d1117; color:#c9d1d9; font-family:'Inter',system-ui,sans-serif;
      display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; }
    .card { max-width:420px; padding:40px 32px; }
    .logo { font-size:1.8rem; font-style:italic; color:#01696f; margin-bottom:24px;
      font-family:Georgia,serif; }
    h1 { font-size:1.1rem; font-weight:600; margin-bottom:12px; }
    p { font-size:0.875rem; color:#7d8590; line-height:1.6; margin-bottom:24px; }
    .bar { width:100%; height:3px; background:#21262d; border-radius:2px; overflow:hidden; }
    .bar-fill { height:100%; background:#da7101; border-radius:2px;
      animation: fill 3s linear forwards; }
    @keyframes fill { from{width:0} to{width:100%} }
    .skip { display:block; margin-top:20px; font-size:0.78rem; color:#484f58;
      text-decoration:none; }
    .skip:hover { color:#da7101; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">OpenClay</div>
    <h1>You're being redirected to OpenClay Pro</h1>
    <p>Taking you to our secure checkout on Gumroad. Your data stays on your machine — always.</p>
    <div class="bar"><div class="bar-fill"></div></div>
    <a class="skip" id="skip-link" href="YOUR_GUMROAD_URL">Take me there now &rarr;</a>
  </div>
  <script>
    const GUMROAD_URL = 'https://coanalabs.gumroad.com/l/openclay-pro';
    document.getElementById('skip-link').href = GUMROAD_URL;
    setTimeout(() => { window.location.href = GUMROAD_URL; }, 3000);
  </script>
</body>
</html>
